<!DOCTYPE html>
<html lang="ru" data-theme="{{ .Theme }}" style="font-size: {{ .FontSize }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} — teblorum</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
    <script>
        // Переключение темы (светлая/тёмная)
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('teblorum-theme', next);
        }

        // Изменение размера шрифта
        function changeSize(delta) {
            const html = document.documentElement;
            const current = parseInt(getComputedStyle(html).fontSize);
            const next = Math.min(Math.max(current + delta, 14), 24);
            html.style.fontSize = next + 'px';
            localStorage.setItem('teblorum-font-size', next + 'px');
        }

        // Восстановление сохранённых настроек
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('teblorum-theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
            const savedSize = localStorage.getItem('teblorum-font-size');
            if (savedSize) {
                document.documentElement.style.fontSize = savedSize;
            }
        });
    </script>
    {{ block "head" . }}{{ end }}
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-logo">teblorum</a>
            <div class="nav-links">
                <a href="/articles" class="{{ if eq .Title "Статьи" }}active{{ end }}">Статьи</a>
                <a href="/threads" class="{{ if eq .Title "Треды" }}active{{ end }}">Треды</a>
            </div>
            <div class="nav-controls">
                <button class="btn-icon" onclick="changeSize(-1)" title="Уменьшить шрифт" aria-label="Уменьшить шрифт">A−</button>
                <button class="btn-icon" onclick="changeSize(1)" title="Увеличить шрифт" aria-label="Увеличить шрифт">A+</button>
                <button class="btn-icon" onclick="toggleTheme()" title="Переключить тему" aria-label="Переключить тему">◐</button>
            </div>
            <div class="nav-auth">
                {{ if .CurrentUser }}
                    <a href="/messages" class="nav-messages {{ if eq .Title "Сообщения" }}active{{ end }}">
                        Сообщения
                        {{ if gt .UnreadCount 0 }}
                            <span class="unread-badge">{{ .UnreadCount }}</span>
                        {{ end }}
                    </a>
                    <a href="/settings" class="{{ if eq .Title "Настройки" }}active{{ end }}">Настройки</a>
                    <a href="/users/{{ .CurrentUser.Username }}">{{ .CurrentUser.Username }}</a>
                    <form action="/auth/logout" method="POST" class="inline-form">
                        <button type="submit" class="btn-link">Выйти</button>
                    </form>
                {{ else }}
                    <a href="/auth/login">Войти</a>
                    <a href="/auth/register">Регистрация</a>
                {{ end }}
            </div>
        </div>
    </nav>
    <main class="container">
        {{ block "content" . }}{{ end }}
    </main>
    <footer class="footer">
        <div class="footer-inner">
            <span>teblorum — платформа текстовых публикаций</span>
        </div>
    </footer>
</body>
</html>
