{{ define "content" }}
<div class="auth-page">
    <h1>Регистрация</h1>
    <form action="/auth/register" method="POST" class="auth-form">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" required placeholder="username" maxlength="50">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label for="password">Пароль (минимум 6 символов)</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>
    <div class="auth-alt">
        <a href="/auth/login">Уже есть аккаунт? Войти</a>
    </div>
</div>
{{ end }}
