{{ define "content" }}
<h1>Настройки</h1>
<form action="/settings" method="POST" class="settings-form">
    <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" value="{{ .Username }}" required maxlength="50">
    </div>
    <div class="form-group">
        <label for="bio">О себе</label>
        <textarea id="bio" name="bio" rows="4" maxlength="1000">{{ .Bio }}</textarea>
        <small class="form-hint">Поддерживается Markdown. Максимум 1000 символов.</small>
    </div>
    <div class="form-group">
        <label for="theme">Тема</label>
        <select id="theme" name="theme">
            <option value="light" {{ if eq .Theme "light" }}selected{{ end }}>Светлая</option>
            <option value="dark" {{ if eq .Theme "dark" }}selected{{ end }}>Тёмная</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
{{ end }}
