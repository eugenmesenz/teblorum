{{ define "content" }}
<h1>{{ if eq .PostType "article" }}Новая статья{{ else }}Новый тред{{ end }}</h1>
<form action="/{{ if eq .PostType "article" }}articles{{ else }}threads{{ end }}" method="POST" class="post-form">
    <div class="form-group">
        <label for="title">Заголовок</label>
        <input type="text" id="title" name="title" required maxlength="200" placeholder="Заголовок публикации">
    </div>
    <div class="form-group">
        <label for="body">Текст</label>
        <textarea id="body" name="body" rows="12" required placeholder="Текст публикации в Markdown..."></textarea>
        <small class="form-hint">Поддерживается Markdown с GFM-расширениями (таблицы, зачёркивание, код).</small>
    </div>
    {{ if eq .PostType "article" }}
    <div class="form-group">
        <label class="checkbox-label">
            <input type="checkbox" name="comments_enabled" checked>
            Включить комментарии
        </label>
    </div>
    {{ end }}
    <button type="submit" class="btn btn-primary">{{ if eq .PostType "article" }}Опубликовать статью{{ else }}Создать тред{{ end }}</button>
</form>
{{ end }}
