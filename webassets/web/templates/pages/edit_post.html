{{ define "content" }}
<h1>Редактирование</h1>
<form action="/articles/{{ .PostID }}" method="POST" class="post-form">
    <div class="form-group">
        <label for="title">Заголовок</label>
        <input type="text" id="title" name="title" value="{{ .Title }}" required maxlength="200">
    </div>
    <div class="form-group">
        <label for="body">Текст</label>
        <textarea id="body" name="body" rows="12" required>{{ .Body }}</textarea>
    </div>
    <div class="form-group">
        <label class="checkbox-label">
            <input type="checkbox" name="comments_enabled" {{ if .CommentsEnabled }}checked{{ end }}>
            Включить комментарии
        </label>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
{{ end }}
